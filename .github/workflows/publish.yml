name: Publish catalog

on:
  push:
    branches: [main]
    paths:
      - "knowledge_cards.json"
      - "public/knowledge_cards.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep public/ mirror in sync
        run: |
          mkdir -p public
          cp knowledge_cards.json public/knowledge_cards.json

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("knowledge_cards.json").read_text(encoding="utf-8"))
          assert set(d) == {"version", "updatedAt", "cards"}
          ids = [c["id"] for c in d["cards"]]
          assert len(ids) == len(set(ids)), "duplicate id"
          allowed = {"history", "food", "geo"}
          for c in d["cards"]:
              assert c["category"] in allowed, c["id"]
          print("OK", d["version"], len(ids))
          PY

      # Do not use `if: secrets.*` (GitHub forbids/breaks that). Check env at runtime.
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "FIREBASE_TOKEN secret empty — skip Firebase; raw GitHub URL still works."
            exit 0
          fi
          npm i -g firebase-tools
          firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
          echo "Firebase deploy finished."
