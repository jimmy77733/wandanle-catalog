name: Publish catalog

on:
  push:
    branches: [main]
    paths:
      - "knowledge_cards.json"
      - "public/knowledge_cards.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/publish.yml"
      - "scripts/validate_catalog.py"
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-update]

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply catalog from repository_dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          CATALOG_TEXT: ${{ github.event.client_payload.catalog_text }}
        run: |
          if [ -z "$CATALOG_TEXT" ]; then
            echo "repository_dispatch missing client_payload.catalog_text" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ["CATALOG_TEXT"]
          data = json.loads(raw)
          text = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          Path("knowledge_cards.json").write_text(text, encoding="utf-8")
          Path("public").mkdir(exist_ok=True)
          Path("public/knowledge_cards.json").write_text(text, encoding="utf-8")
          print("wrote catalog from dispatch", data.get("version"), len(data.get("cards", [])))
          PY

      - name: Keep public/ mirror in sync
        if: github.event_name != 'repository_dispatch'
        run: |
          mkdir -p public
          cp knowledge_cards.json public/knowledge_cards.json

      - name: Validate JSON (schema + non-regression)
        run: python3 scripts/validate_catalog.py

      - name: Commit dispatch updates
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "wandanle-bot"
          git config user.email "wandanle-bot@users.noreply.github.com"
          git add knowledge_cards.json public/knowledge_cards.json
          if git diff --cached --quiet; then
            echo "No file changes to commit"
          else
            git commit -m "catalog: update from repository_dispatch"
            git push
          fi

      - name: Deploy Firebase Hosting
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "FIREBASE_TOKEN secret empty — skip Firebase; raw GitHub URL still works."
            exit 0
          fi
          npm i -g firebase-tools
          firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN" --project "$(node -p "require('./.firebaserc').projects.default")"
          echo "Firebase deploy finished."
