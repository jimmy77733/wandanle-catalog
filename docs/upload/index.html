<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灣蛋配送站｜たまご便</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="brand">
        <img
          class="brand-mark"
          src="./brand.png"
          width="88"
          height="88"
          alt="灣蛋啦"
        />
        <h1>灣蛋配送站</h1>
        <p class="sub">たまご便 · 圖鑑 JSON 驗證與發布</p>
      </header>

      <section id="gate-card" class="card gate-card">
        <h2>站門密碼</h2>
        <input
          id="gate"
          type="password"
          autocomplete="current-password"
          aria-label="站門密碼"
          placeholder="請輸入站門密碼"
        />
        <div class="row row-center">
          <button type="button" class="btn-primary" id="gate-btn">進入配送站</button>
        </div>
        <div id="gate-status" class="status"></div>
      </section>

      <section id="main-card" class="card hidden">
        <h2>選擇圖鑑 JSON</h2>
        <p class="hint">
          拖曳或點選完整 <code>knowledge_cards.json</code>。會與線上版比較：禁止張數變少、禁止
          version 倒退。
        </p>
        <label class="drop" id="drop">
          <strong>把 JSON 放在這裡</strong>
          <span>或點此選擇檔案</span>
          <input id="file" type="file" accept=".json,application/json" />
        </label>

        <div class="preview" id="preview" hidden>
          <div class="stat" id="stat-version">
            <span class="n">—</span><span class="l">version</span>
          </div>
          <div class="stat" id="stat-count">
            <span class="n">—</span><span class="l">總張數</span>
          </div>
          <div class="stat" id="stat-delta">
            <span class="n">—</span><span class="l">相對線上新增</span>
          </div>
        </div>
        <ul class="errors" id="errors" hidden></ul>

        <h2 style="margin-top: 22px">發布授權</h2>
        <p class="hint">
          寫入本倉庫需要具備 <strong>Contents</strong> 讀寫權限的 GitHub
          token（僅限本資料庫 repo）。Token 只暫存在此瀏覽器工作階段。
        </p>
        <label for="pat">Token</label>
        <input id="pat" type="password" autocomplete="off" spellcheck="false" />
        <div class="row">
          <button type="button" class="btn-primary" id="upload-btn" disabled>
            上傳並發布
          </button>
          <button type="button" class="btn-secondary" id="download-btn" disabled>
            只驗證下載
          </button>
          <button type="button" class="btn-ghost" id="clear-pat">清除 Token</button>
        </div>
        <div id="work-status" class="status"></div>
      </section>

      <p class="foot">
        公開讀取資料庫：
        <a href="https://wandanle-catalog.web.app/knowledge_cards.json">CDN</a>
        ·
        <a href="https://github.com/jimmy77733/wandanle-catalog">GitHub</a>
        ·
        <a href="https://github.com/jimmy77733/wandanle-catalog/blob/main/README.md">README</a>
      </p>
    </div>

    <script src="./upload.config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
