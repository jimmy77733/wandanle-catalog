<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灣蛋配送站｜たまご便</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="brand">
        <img
          class="brand-mark"
          src="./brand.png"
          width="88"
          height="88"
          alt="灣蛋啦"
        />
        <h1>灣蛋配送站</h1>
        <p class="sub">たまご便 · 圖鑑 JSON 驗證與發布</p>
      </header>

      <section id="gate-card" class="card gate-card">
        <h2>站門密碼</h2>
        <input
          id="gate"
          type="password"
          autocomplete="current-password"
          aria-label="站門密碼"
          placeholder="請輸入站門密碼"
        />
        <div class="row row-center">
          <button type="button" class="btn-primary" id="gate-btn">進入配送站</button>
        </div>
        <div id="gate-status" class="status"></div>
      </section>

      <section id="main-card" class="card hidden">
        <h2>選擇圖鑑 JSON</h2>
        <p class="hint">
          拖曳或點選完整 <code>knowledge_cards.json</code>。會與線上版比較：禁止張數變少、禁止
          version 倒退。
        </p>
        <label class="drop" id="drop">
          <strong>把 JSON 放在這裡</strong>
          <span>或點此選擇檔案</span>
          <input id="file" type="file" accept=".json,application/json" />
        </label>

        <div class="preview" id="preview" hidden>
          <div class="stat" id="stat-version">
            <span class="n">—</span><span class="l">version</span>
          </div>
          <div class="stat" id="stat-count">
            <span class="n">—</span><span class="l">總張數</span>
          </div>
          <div class="stat" id="stat-delta">
            <span class="n">—</span><span class="l">相對線上新增</span>
          </div>
        </div>
        <ul class="errors" id="errors" hidden></ul>

        <h2 style="margin-top: 22px">發布授權</h2>
        <p class="hint">
          寫入本倉庫需要具備 <strong>Contents</strong> 讀寫權限的 GitHub
          token（僅限本資料庫 repo）。Token 只暫存在此瀏覽器工作階段。
        </p>
        <label for="pat">Token</label>
        <div class="secret-field">
          <input id="pat" type="password" autocomplete="off" spellcheck="false" />
          <button
            type="button"
            class="eye-btn"
            id="pat-toggle"
            aria-label="顯示 Token"
            title="顯示／隱藏"
            aria-pressed="false"
          >
            <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
              />
            </svg>
            <svg class="eye-shut hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                fill="currentColor"
                d="M2.1 3.5 3.5 2.1l18.4 18.4-1.4 1.4-3.1-3.1A12.7 12.7 0 0 1 12 19c-5 0-9.3-3.1-11-7a13.4 13.4 0 0 1 4.6-5.2L2.1 3.5zM12 7a5 5 0 0 1 4.9 4l-1.7-1.7A3 3 0 0 0 12 9V7zm9.7 4.2c-.5 1.1-1.2 2.1-2.1 3l-2.1-2.1c.3-.6.5-1.2.5-1.9a5 5 0 0 0-5-5c-.7 0-1.3.2-1.9.5L9.3 3.9A12.6 12.6 0 0 1 12 5c5 0 9.3 3.1 11 7a13 13 0 0 1-1.3 2.2z"
              />
            </svg>
          </button>
        </div>
        <div class="row">
          <button type="button" class="btn-primary" id="upload-btn" disabled>
            上傳並發布
          </button>
          <button type="button" class="btn-secondary" id="download-btn" disabled>
            只驗證下載
          </button>
          <button type="button" class="btn-ghost" id="clear-pat">清除 Token</button>
        </div>
        <div id="work-status" class="status"></div>
      </section>

      <p class="foot">
        公開讀取資料庫：
        <a href="https://wandanle-catalog.web.app/knowledge_cards.json">CDN</a>
        ·
        <a href="https://github.com/jimmy77733/wandanle-catalog">GitHub</a>
        ·
        <a href="https://github.com/jimmy77733/wandanle-catalog/blob/main/README.md">README</a>
      </p>
    </div>

    <script src="./upload.config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
